server {
    listen 80;
    server_name localhost;

    root /var/www/public;  # Assure-toi que cela pointe vers ton dossier public Laravel

    # Index file
    index index.php index.html index.htm;

    # Gère les fichiers statiques (CSS, JS, images, etc.)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pour gérer les requêtes PHP
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;  # App PHP-FPM avec conteneur Docker
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Protection contre les fichiers .htaccess
    location ~ /\.ht {
        deny all;
    }

    # Limite la taille des fichiers téléchargés (si tu rencontres une erreur 413)
    client_max_body_size 10M;  # Augmente cette valeur si nécessaire (en fonction de la taille de tes fichiers)

    # Assure-toi que les fichiers de styles et JS sont bien servis
    location ~* \.(css|js|json|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
    
    # Les en-têtes de sécurité (si tu veux ajouter des politiques de sécurité)
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Frame-Options SAMEORIGIN;

    # Redirection HTTP -> HTTPS (si tu veux forcer HTTPS)
    # listen 443 ssl;
    # ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    # ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
}

