version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      APP_ENV: production
      APP_KEY: base64:your_app_key_here
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: isi_burgers
      DB_USERNAME: postgres
      DB_PASSWORD: okok
    depends_on:
      - db
    networks:
      - laravel_network

  db:
    image: postgres:15
    container_name: pgsql_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: isi_burgers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: okok
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - laravel_network

  nginx:
    image: nginx:latest
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel_network

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock 
      - jenkins_home:/var/jenkins_home
    ports:
      - "8080:8080"
      - "50000:50000"
    networks:
      - laravel_network

volumes:
  pgdata:
  jenkins_home:

networks:
  laravel_network:
    driver: bridge