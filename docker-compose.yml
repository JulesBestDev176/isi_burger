version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=isi_burgers
      - DB_USERNAME=postgres
      - DB_PASSWORD=okok
    depends_on:
      - db

  db:
    image: postgres:13
    environment:
      POSTGRES_DB: isi_burgers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: okok
    ports:
      - "5432:5432"